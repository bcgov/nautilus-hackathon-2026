name: OpenShift Build and Rollout

on:
  push:
    branches:
      - develop

jobs:
  build-and-rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install oc
        run: |
          curl -fsSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/4.15.7/openshift-client-linux-4.15.7.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/oc /usr/local/bin/oc
          sudo rm -rf /tmp/kubectl /tmp/oc

      - name: Login to OpenShift
        run: oc login --token="${{ secrets.OPENSHIFT_TOKEN }}" --server="${{ secrets.OPENSHIFT_SERVER }}"

      - name: Start build
        run: oc -n e52f12-dev start-build nautilus --follow

      - name: Rollout restart
        run: oc -n e52f12-dev rollout restart deployment/nautilus
