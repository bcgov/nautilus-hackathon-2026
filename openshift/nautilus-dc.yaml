apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautilus
  labels:
    app: nautilus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nautilus
  template:
    metadata:
      labels:
        app: nautilus
    spec:
      containers:
        - name: nautilus
          image: "image-registry.openshift-image-registry.svc:5000/e52f12-dev/nautilus:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 500Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
---
apiVersion: v1
kind: Service
metadata:
  name: nautilus
  labels:
    app: nautilus
spec:
  selector:
    app: nautilus
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
