apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: nautilus2
  labels:
    app: nautilus2
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: nautilus2
  labels:
    app: nautilus2
spec:
  source:
    type: Git
    git:
      uri: "https://github.com/bcgov/nautilus-hackathon-2026.git"
      ref: openshift2
    contextDir: nautilus
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: ./Dockerfile-Openshift2
  output:
    to:
      kind: ImageStreamTag
      name: nautilus2:latest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  runPolicy: Serial
